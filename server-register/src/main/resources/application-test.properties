spring.application.name=server-register
server.port=8902

spring.r2dbc.show-sql=true
logging.level.io.r2dbc=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG

svc.keycloak.realm=master
svc.keycloak.docker-real=docker-real
svc.keycloak.username=admin
svc.keycloak.password=admin
svc.keycloak.client-id=admin-cli
svc.keycloak.client-secret=test-client-secret
svc.keycloak.url=http://localhost:8181
svc.kafka.bootstrapAddress=localhost:29092

# MySQL R2DBC Connection
spring.r2dbc.url=r2dbc:mysql://localhost:3308/mscv_information_test
spring.r2dbc.username=root
spring.r2dbc.password=testing

# Email Configuration
email.sender=test-sender@example.com
email.password=test-email-password

management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health,info,auditevents
