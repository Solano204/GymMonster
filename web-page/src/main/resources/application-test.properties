spring.application.name=web-page
server.port=8903

# Redis Configuration
svc.redis.host=localhost
svc.redis.port=6379
svc.redis.password=test-redis-password
svc.kafka.bootstrapAddress=localhost:29092

svc.info.name=server-information
svc.info.port=8111
svc.info.url=lb://server-information

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/docker-real
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8181/realms/docker-real/protocol/openid-connect/certs
jwt.auth.converter.resource-id=Docker-Gym
jwt.auth.converter.principle-attribute=preferred_username

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=health,info,auditevents
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
