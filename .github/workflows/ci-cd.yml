name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - server-administrator
          - server-informations
          - server-register
          - web-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Known gap: server-informations' ClientRepositoryTest/KeycloakServiceImplIntegrationTest
      # expect a manually-started docker-compose-test-inf.yaml stack (real MySQL/Keycloak on
      # fixed ports), not auto-managed Testcontainers, and web-page's contextLoads needs a
      # reachable Redis - neither is started here, so those specific tests are expected to fail
      # in this job until that test infrastructure is wired up (tracked separately, not a CI
      # config problem). Every other test in this repo is self-contained and should pass.
      - name: mvn verify
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B -ntp verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  build-and-push:
    name: Build & push image (${{ matrix.service }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - server-administrator
          - server-informations
          - server-register
          - web-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/solano204/gymmonster-${{ matrix.service }}:latest
            ghcr.io/solano204/gymmonster-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
