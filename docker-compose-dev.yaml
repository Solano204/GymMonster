# Doc 2 hardening notes:
# - Secrets and restart policies were already handled well before this pass
#   (.env gitignored with a .env.example template, ${VAR:?required} guards -
#   not touched here).
# - Real bug found and fixed: db-keycloak published "5433:5433" and Keycloak's
#   own DB_PORT was set to 5433, but nothing told the Postgres container to
#   actually listen on 5433 - the official postgres image defaults to 5432
#   internally. Since Keycloak talks to db-keycloak over the docker network
#   (not through the published host port), it would have been trying to
#   reach a port nothing was listening on. Added `command: ["-p", "5433"]` to
#   make the container's actual listening port match what everything else
#   here already assumed.
# - Added healthchecks + `condition: service_healthy` throughout - nothing had
#   a healthcheck before, so `depends_on` only ever waited for the container
#   to start, not for MySQL/Keycloak/Kafka/etc. to actually be ready.
# - Split the single flat network into `data-network` (MySQL, Keycloak +
#   its Postgres, Redis, Kafka/Zookeeper) and `app-network` (Eureka, Config
#   Server, gateway, the 5 application services) - app services are
#   multi-homed onto both since they need their respective data stores.
#   Not marking data-network `internal: true`: every service here also
#   publishes a host port, and published-port reachability on an internal
#   bridge network is inconsistent across Docker Engine/Desktop versions
#   (same reasoning as food-ordering-system's and furniture_store's Doc 2).
# - Resource limits and log rotation added to every service - neither existed
#   before.
#
# Real deployment target is Kubernetes (see deployments/, configMaps/,
# Secrets/) - this file is the local-dev path, which is why Eureka/Config
# Server exist here at all (PORTFOLIO.md: production uses Spring Cloud
# Kubernetes' own in-cluster discovery, not a separate registry).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true

services:
  # MySQL
  mysql:
    image: mysql:8
    container_name: mysql-server
    ports:
      - "3307:3306"  # External port 3307, internal port 3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: mscv_information
    networks:
      - data-network
    volumes:
      - mysql-data-pr2:/var/lib/mysql
    restart: always
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Keycloak
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:21.0.2
    command: ["start-dev"]
    ports:
      - "8181:8181"
    depends_on:
      db-keycloak:
        condition: service_healthy
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: db-keycloak
      DB_DATABASE: db_keycloak
      DB_PORT: 5433
      DB_USER: uncledave
      DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8181
    networks:
      - data-network
      - app-network
    volumes:
      - keycloak-data-pr2:/opt/keycloak/data
    restart: always
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      # Keycloak 21's start-dev image has no curl/wget, and /health isn't
      # enabled by default without extra config - this checks the port
      # itself accepts TCP connections rather than an HTTP health path.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8181 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # PostgreSQL for Keycloak
  db-keycloak:
    container_name: db-keycloak
    image: postgres:15.2
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_keycloak
      POSTGRES_USER: uncledave
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "5433:5433"
    # See top-of-file note - without this the container listens on the
    # default 5432, not the 5433 everything else here assumes.
    command: ["-p", "5433"]
    networks:
      - data-network
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uncledave -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Eureka Server
  eureka-server:
    image: joshua76i/eurecka-pr2:latest
    container_name: eureka-container
    ports:
      - "8761:8761"
    networks:
      - app-network
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # Config Server
  server-configuration:
    image: joshua76i/config-server-pr2:latest
    container_name: config-container
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    networks:
      - app-network
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # Spring Cloud Gateway
  gateway:
    image: joshua76i/gateway-project2:latest
    container_name: gateway-container
    ports:
      - "8081:8081"
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      server-configuration:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data-network
      - app-network
    restart: on-failure
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # Redis
  redis:
    image: redis:alpine3.20
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - data-network
    volumes:
      - redis-data-pr2:/data  # Custom volume name
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Zipkin (Doc 8) - not gated on by any service's depends_on: a trace
  # export failure just drops spans silently, it doesn't fail requests, so
  # it doesn't belong in the same "must be ready first" tier as MySQL/Kafka.
  zipkin:
    image: openzipkin/zipkin:3.3
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # Administrator Service
  server-administrator:
    image: joshua76i/server-administrator-pr2:latest
    container_name: admin-container
    ports:
      - "8900:8900"
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      server-configuration:
        condition: service_healthy
    networks:
      - data-network
      - app-network
    restart: on-failure
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8900/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # Information Service
  information-service:
    image: joshua76i/server-information-pr2:latest
    container_name: server-info-container
    ports:
      - "8111:8111"
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      server-configuration:
        condition: service_healthy
    networks:
      - data-network
      - app-network
    restart: on-failure
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8111/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # Register Service
  server-register:
    image: joshua76i/server-register-pr2:latest
    container_name: server-register-container
    ports:
      - "8902:8902"
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      server-configuration:
        condition: service_healthy
    networks:
      - data-network
      - app-network
    restart: on-failure
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8902/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # Web Page Service
  web-page:
    image: joshua76i/web-page-pr2:latest
    container_name: web-page-container
    ports:
      - "8903:8903"
    environment:
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      server-configuration:
        condition: service_healthy
    networks:
      - data-network
      - app-network
    restart: on-failure
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8903/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 22181:2181
    networks:
      - data-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5000 || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "flow:1:1" # Topic name: "flow", 1 partition, replication factor 1
    networks:
      - data-network
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    <<: *default-security
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

networks:
  data-network:
    driver: bridge
  app-network:
    driver: bridge

volumes:
  redis-data-pr2: {}  # Custom volume name
  mysql-data-pr2: {}
  keycloak-data-pr2: {}
