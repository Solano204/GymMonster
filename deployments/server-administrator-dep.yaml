apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-administrator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server-administrator
  template:
    metadata:
      labels:
        app: server-administrator
    spec:
      containers:
        - name: server-administrator
          image: joshua76i/server-administrator-pr2:latest # Replace with your actual image
          ports:
            - containerPort: 8900
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: svc-admin-map
                  key: server.port-dev
            - name: SERVER_INF_NAME
              valueFrom:
                configMapKeyRef:
                  name: svc-admin-map
                  key: info-server-dev
            - name: SERVER_INF_URL
              valueFrom:
                configMapKeyRef:
                  name: svc-admin-map
                  key: info-server-uri-dev
            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: keycloak-map
                  key: JWT_ISSUER_URI
            - name: JWT_JWK_URI
              valueFrom:
                configMapKeyRef:
                  name: keycloak-map
                  key: JWT_JWK_SET_URI
            - name: JWT_RESOURCE_ID
              valueFrom:
                configMapKeyRef:
                  name: keycloak-map
                  key: JWT_RESOURCE_ID
            - name: JWT_PRINCIPAL_ATTR
              valueFrom:
                configMapKeyRef:
                  name: keycloak-map
                  key: JWT_PRINCIPLE_ATTRIBUTE

---

apiVersion: v1
kind: Service
metadata:
  name: server-administrator
spec:
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8900        # Exposed port for clients
      targetPort: 8900 # Port on which the container listens
  selector:
    app: server-administrator
