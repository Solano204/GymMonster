apiVersion: v1
kind: ConfigMap
metadata:
  name: svc-info-map
data:
  # Consumed directly via configMapKeyRef in server-information-dep.yaml.
  # R2DBC_USERNAME/R2DBC_PASSWORD come from the app-secrets Secret, not here.
  server.port-dev: "8111"
  r2dbc-url-dev: "r2dbc:mysql://mysql-server:3306/mscv_information"
